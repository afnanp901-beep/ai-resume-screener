<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Screener</title>
</head>
<body>
    <h1>AI Resume Screening Dashboard</h1>
    
    <!-- This form allows users to upload a file to the backend -->
   <!-- Enforces PDF selection in the file browser -->
    <form action="/predict" method="POST" enctype="multipart/form-data">
        <label for="resume">Upload Resume (PDF only):</label>
        <input type="file" id="resume" name="resume" accept=".pdf" required>
        <br><br>
        <button type="submit">Screen Resume</button>
    </form>

    <!-- This section displays the result after the AI finishes screening -->
    {% if prediction %}
        <h2>Screening Results:</h2>
        <pre>{{ prediction }}</pre>
    {% endif %}
</body>
</html>
